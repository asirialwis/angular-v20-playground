<div>
  <h2>Supabase Auth Demo</h2>

  <input
    type="email"
    placeholder="Email"
    [(ngModel)]="email"
  />

  <input
    type="password"
    placeholder="Password"
    [(ngModel)]="password"
  />

  <button (click)="signIn()">Login</button>
  <button (click)="signUp()">Signup</button>

  <p>{{ message }}</p>
</div>
